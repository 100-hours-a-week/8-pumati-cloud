# 백엔드 애플리케이션 Service 템플릿
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pumati-backend.fullname" . }}
  labels:
    {{- include "pumati-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "pumati-backend.selectorLabels" . | nindent 4 }} 