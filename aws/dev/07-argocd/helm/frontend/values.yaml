# 프론트엔드 애플리케이션 기본 설정값

# 이름 오버라이드 설정
nameOverride: ""
fullnameOverride: ""

# 복제본 수
replicaCount: 2

# 컨테이너 이미지 설정
image:
  repository: pumati/frontend  # ECR 또는 Docker Hub 레지스트리 주소로 변경 필요
  pullPolicy: Always
  tag: "latest"  # Jenkins에서 빌드 시 동적으로 변경됨

# 이미지 풀 시크릿 (프라이빗 레지스트리 사용 시)
imagePullSecrets: []

# 서비스 계정 설정
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod 보안 컨텍스트
podSecurityContext:
  fsGroup: 2000

# 컨테이너 보안 컨텍스트
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# 서비스 설정
service:
  type: ClusterIP
  port: 80
  targetPort: 3000  # React 앱 기본 포트

# 인그레스 설정
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: pumati.example.com  # 실제 도메인으로 변경 필요
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frontend-tls
      hosts:
        - pumati.example.com

# 리소스 제한
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# 오토스케일링 설정
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# 노드 선택자
nodeSelector: {}

# 톨러레이션
tolerations: []

# 어피니티
affinity: {}

# 환경 변수
env:
  - name: NODE_ENV
    value: "production"
  - name: REACT_APP_API_URL
    value: "https://api.pumati.example.com"  # 백엔드 API URL

# 설정맵 마운트 (필요한 경우)
configMap:
  enabled: false
  data: {}

# 시크릿 마운트 (필요한 경우)
secret:
  enabled: false
  data: {}

# 헬스체크 설정
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# 볼륨 마운트 (정적 파일 등)
volumes: []
volumeMounts: []

# Pod 중단 예산
podDisruptionBudget:
  enabled: true
  minAvailable: 1 