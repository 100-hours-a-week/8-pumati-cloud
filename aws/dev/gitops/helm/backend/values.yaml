# 🚀 Pumati 백엔드 - 최소 설정

# 📦 컨테이너 이미지 설정
image:
  repository: 236450698266.dkr.ecr.ap-northeast-2.amazonaws.com/pumati-backend
  pullPolicy: Always
  tag: "latest"

# 📊 기본 배포 설정
replicaCount: 1

# 🌐 서비스 설정 (간단한 ClusterIP)
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# 💪 최소 리소스 제한
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

# 🔧 간단한 헬스체크
livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

# 🎯 노드 선택자 (시스템 노드에 배포)
nodeSelector:
  node-type: application

# ===== 모든 고급 기능 비활성화 =====

# 🚪 Ingress 비활성화
ingress:
  enabled: false

# 📈 HPA 비활성화  
autoscaling:
  enabled: false

# 🛡️ PodDisruptionBudget 비활성화
podDisruptionBudget:
  enabled: false

# 📋 ConfigMap 비활성화 (도커에 이미 설정 포함)
configMap:
  enabled: false

# 🌍 환경 변수 없음 (도커파일에 이미 포함)
env: []

# 🔐 시크릿 환경 변수 없음
secretEnv: []

# 📁 볼륨 없음
volumes: []
volumeMounts: []

# 🏷️ 추가 설정들 없음
tolerations: []
affinity: {}
podLabels: {}

# 🔐 보안 컨텍스트 기본값
podSecurityContext: {}
securityContext: {}

# 👤 서비스 계정 기본값
serviceAccount:
  create: false
  annotations: {}
  name: ""

# 🔄 업데이트 전략 기본값
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1 