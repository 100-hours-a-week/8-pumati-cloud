# 백엔드 애플리케이션 기본 설정값

# 이름 오버라이드 설정
nameOverride: ""
fullnameOverride: ""

# 복제본 수
replicaCount: 2

# 컨테이너 이미지 설정
image:
  repository: pumati/backend  # ECR 또는 Docker Hub 레지스트리 주소로 변경 필요
  pullPolicy: Always
  tag: "latest"  # Jenkins에서 빌드 시 동적으로 변경됨

# 이미지 풀 시크릿 (프라이빗 레지스트리 사용 시)
imagePullSecrets: []

# 서비스 계정 설정
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod 보안 컨텍스트
podSecurityContext:
  fsGroup: 2000

# 컨테이너 보안 컨텍스트
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false  # 백엔드는 로그 파일 등을 위해 쓰기 가능
  runAsNonRoot: true
  runAsUser: 1000

# 서비스 설정
service:
  type: ClusterIP
  port: 80
  targetPort: 8080  # Spring Boot 기본 포트

# 인그레스 설정
ingress:
  enabled: true
  className: "alb"
  hosts:
    - host: dev.tebutebu.com  # 메인 도메인 사용
      paths:
        - path: /api          # 백엔드 API 경로
          pathType: Prefix
        - path: /oauth2       # OAuth2 경로  
          pathType: Prefix

# 리소스 제한
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# 오토스케일링 설정
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# 노드 선택자
nodeSelector: {}

# 톨러레이션
tolerations: []

# 어피니티
affinity: {}

# 환경 변수
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  - name: SERVER_PORT
    value: "8080"
  - name: DB_HOST
    value: "mysql.pumati.local"  # 03-db에서 생성한 MySQL 호스트
  - name: DB_PORT
    value: "3306"
  - name: DB_NAME
    value: "pumati"
  - name: REDIS_HOST
    value: "redis.pumati.local"  # Redis 호스트 (필요시)
  - name: REDIS_PORT
    value: "6379"

# 시크릿 환경 변수 (데이터베이스 비밀번호 등)
secretEnv:
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: mysql-secret
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mysql-secret
        key: password

# 설정맵 마운트
configMap:
  enabled: true
  data:
    application.yml: |
      server:
        port: 8080
      spring:
        datasource:
          url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
        jpa:
          hibernate:
            ddl-auto: validate
          show-sql: false
          properties:
            hibernate:
              dialect: org.hibernate.dialect.MySQL8Dialect
        redis:
          host: ${REDIS_HOST}
          port: ${REDIS_PORT}
      logging:
        level:
          com.pumati: INFO
        file:
          name: /app/logs/application.log

# 시크릿 마운트 (필요한 경우)
secret:
  enabled: false
  data: {}

# 헬스체크 설정
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# 볼륨 마운트 (로그 파일 등)
volumes:
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: logs
    mountPath: /app/logs

# Pod 중단 예산
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# 데이터베이스 마이그레이션 Job (필요한 경우)
migration:
  enabled: false
  image:
    repository: pumati/migration
    tag: "latest" 