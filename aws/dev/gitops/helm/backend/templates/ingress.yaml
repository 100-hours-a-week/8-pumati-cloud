# 🌐 Pumati 백엔드 Ingress (HTTPS 지원)
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pumati-backend-ingress
  namespace: pumati
  annotations:
    # 최소한의 ALB 설정만 유지
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:236450698266:certificate/63c6ca35-1946-4bd0-8057-b5fe5c656dd5"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /api/actuator/health
    alb.ingress.kubernetes.io/target-group-attributes: load_balancing.algorithm.type=round_robin,health_check.enabled=false
spec:
  ingressClassName: alb
  rules:
    - host: dev.tebutebu.com
      http:
        paths:
          # ✅ 헬스체크 경로 추가 (맨 위에)
          - path: /api/actuator/health
            pathType: Exact
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # /api 경로 → 백엔드 서비스
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # /oauth2 경로 → 백엔드 서비스  
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # / 경로 (기본) → 프론트엔드 서비스 (우선순위상 마지막에 배치)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pumati-frontend
                port:
                  number: 80
{{- end }} 