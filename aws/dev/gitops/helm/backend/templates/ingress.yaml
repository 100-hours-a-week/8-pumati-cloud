# 🌐 Pumati 백엔드 Ingress (HTTPS 지원)
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pumati-backend-ingress
  namespace: pumati
  annotations:
    # AWS ALB 설정
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # 🔥 HTTPS 설정 추가
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:236450698266:certificate/63c6ca35-1946-4bd0-8057-b5fe5c656dd5"
    alb.ingress.kubernetes.io/ssl-redirect: '443'  # HTTP → HTTPS 리다이렉트
spec:
  ingressClassName: alb
  rules:
    - host: dev.tebutebu.com
      http:
        paths:
          # /api 경로 → 백엔드 서비스
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # /oauth2 경로 → 백엔드 서비스  
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
{{- end }} 