# 🌐 Pumati 백엔드 Ingress (HTTPS 지원)
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pumati-backend-ingress
  namespace: pumati
  annotations:
    # AWS ALB 설정
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # 🔥 HTTPS 설정 추가
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:236450698266:certificate/63c6ca35-1946-4bd0-8057-b5fe5c656dd5"
    alb.ingress.kubernetes.io/ssl-redirect: '443'  # HTTP → HTTPS 리다이렉트
    # 🌐 OAuth 콜백을 위한 헤더 설정 강화
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      routing.http.preserve_host_header.enabled=true,
      routing.http.x_forwarded_for.enabled=true,
      routing.http2.enabled=true
    # 🔐 OAuth 리다이렉트를 위한 추가 헤더 설정
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # 🎯 헤더 보존 설정 (Session Affinity는 K8s Service에서 처리)
    alb.ingress.kubernetes.io/target-group-attributes: |
      preserve_client_ip.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: dev.tebutebu.com
      http:
        paths:
          # /api 경로 → 백엔드 서비스
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # /oauth2 경로 → 백엔드 서비스  
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # / 경로 (기본) → 프론트엔드 서비스 (우선순위상 마지막에 배치)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pumati-frontend
                port:
                  number: 80
{{- end }} 