# 🌐 간단한 Pumati 백엔드 Ingress
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pumati-backend-ingress
  namespace: pumati
  annotations:
    # AWS ALB 설정
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - host: dev.tebutebu.com
      http:
        paths:
          # /api 경로 → 백엔드 서비스
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
          # /oauth2 경로 → 백엔드 서비스  
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: pumati-backend
                port:
                  number: 80
{{- end }} 