# 🚀 Pumati 백엔드 애플리케이션 Deployment 템플릿
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pumati-backend.fullname" . }}
  labels:
    {{- include "pumati-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  
  # 🔄 롤링 업데이트 전략
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  
  selector:
    matchLabels:
      {{- include "pumati-backend.selectorLabels" . | nindent 6 }}
      
  template:
    metadata:
      annotations:
        # 📋 설정 변경 시 자동 재배포를 위한 체크섬
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # 🔄 Pod 재시작을 위한 타임스탬프
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        {{- include "pumati-backend.selectorLabels" . | nindent 8 }}
        # 🏷️ 추가 라벨
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 👤 서비스 계정 (IRSA 권한)
      serviceAccountName: {{ include "pumati-backend.serviceAccountName" . }}
      
      # 🔒 Pod 보안 컨텍스트
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      
      # 🎯 Pod 종료 대기 시간
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      
      containers:
        - name: {{ .Chart.Name }}
          # 🛡️ 컨테이너 보안 컨텍스트
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            
          # 🐳 컨테이너 이미지
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          # 🌐 포트 설정
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
              
          # 🌍 환경 변수 설정
          env:
            # 기본 환경 변수
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            
            # 🔐 시크릿 환경 변수
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
            {{- end }}
            
            # 📋 Pod 정보 환경 변수
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
                  
          # 🔧 헬스체크 설정
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
            
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
            
          # 💪 리소스 제한
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
            
          # 📁 볼륨 마운트
          volumeMounts:
            # ConfigMap 마운트
            {{- if .Values.configMap.enabled }}
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- end }}
            
            # 추가 볼륨 마운트
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            
          # 🛡️ 라이프사이클 훅 (우아한 종료)
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 15"
                  
      # 📁 볼륨 설정
      volumes:
        # ConfigMap 볼륨
        {{- if .Values.configMap.enabled }}
        - name: config
          configMap:
            name: {{ include "pumati-backend.fullname" . }}-config
            defaultMode: 0644
        {{- end }}
        
        # 추가 볼륨
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        
      # 🎯 노드 선택자
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 🎯 어피니티 설정
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 🏷️ 톨러레이션
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 🔄 DNS 정책
      dnsPolicy: ClusterFirst
      
      # 🔄 재시작 정책
      restartPolicy: Always 