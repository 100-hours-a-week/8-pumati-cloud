# 🚀 간단한 Pumati 백엔드 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pumati-backend
  namespace: pumati
  labels:
    app: pumati-backend
    version: v1
spec:
  replicas: 1
  
  # 🔄 롤링 업데이트 전략
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  
  selector:
    matchLabels:
      app: pumati-backend
      
  template:
    metadata:
      labels:
        app: pumati-backend
        version: v1
        
    spec:
      containers:
        - name: pumati-backend
          # 🐳 ECR 이미지
          image: "236450698266.dkr.ecr.ap-northeast-2.amazonaws.com/pumati-dev-backend-ecr:latest"
          imagePullPolicy: Always
          
          # 🌐 포트 설정
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            
          # 💪 리소스 제한
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
        
      # 🎯 노드 선택자 (application 노드에 배포)
      nodeSelector:
        node-type: application
      
      # 🔄 DNS 정책
      dnsPolicy: ClusterFirst
      
      # 🔄 재시작 정책
      restartPolicy: Always 