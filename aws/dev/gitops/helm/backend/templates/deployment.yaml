# 🚀 Pumati 백엔드 애플리케이션 Deployment (간소화 버전)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pumati-backend.fullname" . }}
  labels:
    {{- include "pumati-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  
  # 🔄 롤링 업데이트 전략
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  
  selector:
    matchLabels:
      {{- include "pumati-backend.selectorLabels" . | nindent 6 }}
      
  template:
    metadata:
      annotations:
        # 🔄 Pod 재시작을 위한 타임스탬프
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        {{- include "pumati-backend.selectorLabels" . | nindent 8 }}
        
    spec:
      # 🔒 Pod 보안 컨텍스트
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      
      containers:
        - name: {{ .Chart.Name }}
          # 🛡️ 컨테이너 보안 컨텍스트
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            
          # 🐳 컨테이너 이미지
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          # 🌐 포트 설정
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
              
          # 🌍 환경 변수 설정 (조건부)
          {{- if .Values.env }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
            
          # 💪 리소스 제한
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
            
          # 📁 볼륨 마운트 (조건부)
          {{- if .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
                  
      # 📁 볼륨 설정 (조건부)
      {{- if .Values.volumes }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- end }}
        
      # 🎯 노드 선택자
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 🎯 어피니티 설정 (조건부)
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 🏷️ 톨러레이션 (조건부)
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # 🔄 DNS 정책
      dnsPolicy: ClusterFirst
      
      # 🔄 재시작 정책
      restartPolicy: Always 