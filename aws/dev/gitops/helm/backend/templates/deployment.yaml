# 🚀 간단한 Pumati 백엔드 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pumati-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pumati-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  
  # 🔄 롤링 업데이트 전략
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  
  selector:
    matchLabels:
      {{- include "pumati-backend.selectorLabels" . | nindent 6 }}
      
  template:
    metadata:
      labels:
        {{- include "pumati-backend.selectorLabels" . | nindent 8 }}
        
    spec:
      containers:
        - name: pumati-backend
          # 🐳 ECR 이미지
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          # 🌐 포트 설정
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          # 🌍 환경 변수
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
            
          # 💪 리소스 제한
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.livenessProbe.httpGet }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            {{- else if .Values.livenessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.livenessProbe.tcpSocket.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.readinessProbe.httpGet }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            {{- else if .Values.readinessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.readinessProbe.tcpSocket.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
        
      # 🎯 노드 선택자
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      
      # 🏷️ Tolerations (System 노드의 taint 허용)
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      
      # 📍 Affinity (노드 어피니티 설정)
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      
      # 🔄 DNS 정책
      dnsPolicy: ClusterFirst
      
      # ❌ restartPolicy 제거 (Deployment에서는 사용 불가) 