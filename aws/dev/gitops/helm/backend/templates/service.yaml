# 🌐 간단한 Pumati 백엔드 Service
apiVersion: v1
kind: Service
metadata:
  name: pumati-backend
  namespace: pumati
  labels:
    app: pumati-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: pumati-backend
    app.kubernetes.io/instance: pumati-backend 