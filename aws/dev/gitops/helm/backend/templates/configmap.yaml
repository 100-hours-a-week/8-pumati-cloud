# 백엔드 애플리케이션 ConfigMap 템플릿
{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pumati-backend.fullname" . }}-config
  labels:
    {{- include "pumati-backend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
{{- end }} 