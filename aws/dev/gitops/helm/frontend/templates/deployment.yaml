apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend.fullname" . }}  # Helm 템플릿 함수로 풀네임 생성
  labels:
    {{- include "frontend.labels" . | nindent 4 }}  # 공통 레이블 포함
spec:
  replicas: {{ .Values.replicaCount }}  # values.yaml에서 복제본 수 가져오기
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}  # 셀렉터 레이블
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}  # 파드 레이블
    spec:
      securityContext:  # 보안 컨텍스트 설정
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}  # 컨테이너 이름
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"  # 이미지 정보
        imagePullPolicy: {{ .Values.image.pullPolicy }}  # 이미지 풀 정책
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}  # 컨테이너 포트
          protocol: TCP
        {{- if .Values.healthCheck.enabled }}  # 헬스체크가 활성화된 경우
        livenessProbe:  # 생존 확인 프로브
          httpGet:
            path: {{ .Values.healthCheck.path }}  # 헬스체크 경로
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}  # 초기 대기 시간
          periodSeconds: {{ .Values.healthCheck.periodSeconds }}  # 체크 주기
        readinessProbe:  # 준비 상태 확인 프로브
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.periodSeconds }}
        {{- end }}
        env:  # 환경 변수 설정
        {{- range .Values.env }}  # values.yaml의 env 배열을 순회
        - name: {{ .name }}
          value: {{ .value | quote }}  # 값을 문자열로 처리
        {{- end }}
        resources:  # 리소스 제한 설정
          {{- toYaml .Values.resources | nindent 12 }}
      restartPolicy: Always  # 항상 재시작 정책 