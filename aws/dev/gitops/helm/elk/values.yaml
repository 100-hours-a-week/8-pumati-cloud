# ==============================================================================
# ELK 스택 기본 설정 (학습용 - 최소한만)
# ==============================================================================
# 🎯 목적: 개발 환경에서 ELK 스택 기본 동작 확인
# 📚 학습 포인트: Elasticsearch + Kibana 연결, EBS 볼륨 사용

# ==============================================================================
# Elasticsearch 설정 (로그 저장소)
# ==============================================================================
elasticsearch:
  # 기본 설정
  image: "docker.elastic.co/elasticsearch/elasticsearch:8.15.0"
  
  # 단일 노드로 시작 (학습용)
  replicas: 1
  
  # 리소스 (작게 설정)
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi" 
      cpu: "1000m"
  
  # EBS 볼륨 연결 설정
  persistence:
    enabled: true
    size: "30Gi"  # 01-static에서 생성한 EBS 볼륨 크기
    
  # 개발 환경 설정 (보안 끄기)
  config:
    xpack.security.enabled: false
    discovery.type: single-node

# ==============================================================================  
# Kibana 설정 (웹 대시보드)
# ==============================================================================
kibana:
  # 기본 설정
  image: "docker.elastic.co/kibana/kibana:8.15.0"
  
  # 단일 파드
  replicas: 1
  
  # 리소스 (작게 설정)
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
      
  # Elasticsearch 연결
  elasticsearch:
    hosts: ["http://elasticsearch:9200"]

# ==============================================================================
# 네임스페이스 설정
# ==============================================================================
namespace: "elk-system" 