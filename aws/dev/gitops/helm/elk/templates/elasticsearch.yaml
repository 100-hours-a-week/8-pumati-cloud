# ==============================================================================
# Elasticsearch 간단 배포 (학습용 - 기본 보안 활성화)
# ==============================================================================
# 🎯 목적: 최소한의 보안으로 Elasticsearch 안정적 구동
# 📚 학습 포인트: StatefulSet 기본 구조, 기본 인증 설정

---
# Elasticsearch 서비스
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: {{ .Values.namespace }}
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  selector:
    app: elasticsearch

---
# Elasticsearch StatefulSet (간소화 + 기본 보안)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: {{ .Values.namespace }}
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: {{ .Values.elasticsearch.replicas }}
  
  selector:
    matchLabels:
      app: elasticsearch
  
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: {{ .Values.elasticsearch.image }}
        
        # 🌍 간단한 환경 변수 설정 (기본 보안 활성화)
        env:
        - name: discovery.type
          value: "single-node"  # 단일 노드 모드
        - name: xpack.security.enabled
          value: "true"         # 보안 기능 활성화 (Kibana 연결을 위해 필수)
        - name: xpack.security.enrollment.enabled
          value: "false"        # 자동 등록 비활성화
        - name: xpack.security.http.ssl.enabled
          value: "false"        # HTTP SSL 비활성화 (학습용 간소화)
        - name: xpack.security.transport.ssl.enabled
          value: "false"        # Transport SSL 비활성화 (단일노드이므로)
        - name: ELASTIC_PASSWORD
          value: "pumati123"    # 간단한 개발용 패스워드
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx1g"  # JVM 메모리 설정
        - name: bootstrap.memory_lock
          value: "false"        # 메모리 잠금 비활성화 (권한 문제 방지)
        
        # 포트 설정
        ports:
        - containerPort: 9200
          name: http
        
        # 리소스 제한
        resources:
          {{- toYaml .Values.elasticsearch.resources | nindent 10 }}
        
        # 볼륨 마운트
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        
        # 간단한 헬스체크 (인증 포함)
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
            httpHeaders:
            - name: Authorization
              value: "Basic ZWxhc3RpYzpwdW1hdGkxMjM="  # elastic:pumati123 base64
          initialDelaySeconds: 60  # 1분 후 체크 시작
          periodSeconds: 10        # 10초마다 체크
          timeoutSeconds: 5        # 5초 타임아웃
          failureThreshold: 3      # 3번 실패하면 재시작
        
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
            httpHeaders:
            - name: Authorization
              value: "Basic ZWxhc3RpYzpwdW1hdGkxMjM="  # elastic:pumati123 base64
          initialDelaySeconds: 90  # 90초 후 체크 시작 (여유롭게)
          periodSeconds: 30        # 30초마다 체크
          timeoutSeconds: 5        # 5초 타임아웃
          failureThreshold: 5      # 5번 실패하면 재시작
      
  # 볼륨 클레임 템플릿
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: elasticsearch
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "gp2"
      resources:
        requests:
          storage: {{ .Values.elasticsearch.persistence.size }} 