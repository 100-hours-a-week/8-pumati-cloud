# ==============================================================================
# Kibana 간단 배포 (학습용 - 기본 보안 연동)
# ==============================================================================
# 🎯 목적: Elasticsearch와 기본 인증으로 연결된 Kibana 웹 대시보드 배포
# 📚 학습 포인트: Deployment, Service, Elasticsearch 인증 연결

---
# Kibana 서비스
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: {{ .Values.namespace }}
  labels:
    app: kibana
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  selector:
    app: kibana

---
# Kibana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: {{ .Values.namespace }}
  labels:
    app: kibana
spec:
  replicas: {{ .Values.kibana.replicas }}
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: {{ .Values.kibana.image }}
        
        # 🌍 간단한 환경 변수 (기본 인증 설정)
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"  # Elasticsearch 서비스 연결
        - name: ELASTICSEARCH_USERNAME
          value: "elastic"                    # Elasticsearch 기본 사용자
        - name: ELASTICSEARCH_PASSWORD
          value: "pumati123"                  # Elasticsearch와 동일한 패스워드
        - name: XPACK_SECURITY_ENABLED
          value: "true"                       # 보안 기능 활성화 (Elasticsearch와 맞춤)
        - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
          value: "pumati-kibana-encryption-key-32chars"  # 32자 암호화 키 (필수)
        
        # 포트 설정
        ports:
        - containerPort: 5601
          name: http
        
        # 리소스 제한
        resources:
          {{- toYaml .Values.kibana.resources | nindent 10 }}
        
        # 간단한 헬스체크
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 90  # 1분 30초 후 체크 시작 (Elasticsearch 연결 + 초기화 대기)
          periodSeconds: 10        # 10초마다 체크
          timeoutSeconds: 5        # 5초 타임아웃
          failureThreshold: 5      # 5번 실패하면 재시작 (초기화 시간 고려) 